<!DOCTYPE html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkyBEAT/login</title>
  <link rel="stylesheet" href="./style/output.css"/>
  <link rel="icon" href="./assets/cloud.png" type="image/png">
</head>
<body>
  <div class="min-h-screen bg-white  flex justify-center items-center">
    <main class="w-full px-5 max-w-135.5 flex flex-col gap-5 items-center md:gap-7">
      <h1>
        <a href="index.html">
          <img src="./assets/logo.png" alt="SkyBEAT"/>
        </a>
      </h1>
      <section class="w-full border border-border-default rounded-2xl px-7 py-9 md:py-10" aria-labelledby="login-title">
        <h2 id="login-title" class="sr-only">로그인</h2>
        <form class="flex flex-col gap-6 mb-6">
          <div class="flex flex-col gap-5">
            <!-- 아이디 -->
            <div>
              <label for="user-name" class="sr-only">아이디</label>
              <input
                type="text"
                id="user-name"
                name="user-name" 
                placeholder="아이디 입력"
                class="w-full border-b border-b-border-default"/>
            </div>
            <!-- 비밀번호 -->
            <div>
              <label for="user-password" class="sr-only">비밀번호</label>
              <input
                type="password"
                id="user-password"
                name="user-password"
                placeholder="비밀번호 입력"
                class="w-full border-b border-b-border-default"/>
            </div>
          </div>
          
          <button type="submit" class="btn btn-dark btn-full">로그인</button>
        </form>

        <ul class="flex justify-center items-center gap-3 text-text-secondary text-sm">
          <li class="after:content-['|'] after:ml-2">
            <a href="#" class="hover:text-text-accent hover:border-b border-bor">아이디 찾기</a>
          </li>
          <li>
            <a href="#">비밀번호 찾기</a>
          </li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
